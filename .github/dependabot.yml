version: 2
updates:
  # GitHub Actions の依存更新 (週次)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # リリース直後は、侵害があってもまだ発覚していない時間帯。
    # 取り込みを数日遅らせるだけで踏む確率が下がる。
    # github-actions は `default-days` のみ対応(semver 別の指定は非対応)。
    # patch/minor は auto-merge で人の介在が 0 回になるので長めに取る。
    # セキュリティ更新には cooldown は適用されないため緊急の修正は即日届く。
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Go module 依存更新 (週次)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
      include: "scope"
    # メジャーバージョンアップは PR を作らず、minor/patch のみ自動 PR
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
