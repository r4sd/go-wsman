name: Security Scan

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # 公開リポジトリなので、実環境のアドレスがコメントや golden file に紛れ込むのを防ぐ。
  # 統合テストの実行例コメント経由で十数箇所まで無検出で蓄積していた。
  # 例示用アドレスは RFC 5737 (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) を使うこと。
  #
  # 検出対象は RFC1918 のアドレスのみ。ホスト名・アカウント名・VM 名は検出できないので、
  # そちらは書かないよう気を付けるしかない。
  #
  # 4 オクテット揃っていることを要求する。3 オクテットで妥協すると Windows の
  # バージョン表記 (10.0.26100 等) に誤検知し、実機ダンプの golden file を
  # 「CI を通すために書き換える」圧力が生まれる (それは本末転倒)。
  forbidden-values:
    # 名前は実態に合わせてある。**必須チェックには入っていない**
    # (ruleset の required_status_checks は Lint / Test / Build / gosec の 4 つ)。
    # 必須にするかは要検討: main.yml の if (github.actor == repository_owner) により
    # 外部 PR ではジョブ自体がスキップされるので、必須にすると外部 PR が
    # マージ不能になる。
    name: forbidden values
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # コミットメッセージを走査するステップが履歴を必要とする。
          # 既定の浅いクローンだと base..HEAD が解決できない。
          fetch-depth: 0

      # 走査の中身は .github/scripts/scan_forbidden.sh に置いてある。
      # インラインに書くと (a) ローカルで試せない (b) 検査自身のテストが書けない
      # (c) パターンを YAML のエスケープ越しに書くことになる、の 3 つが効く。
      # スクリプト自体は internal/guard の TestScanForbiddenScript が負のテストで守る。
      - name: Scan tracked files
        run: .github/scripts/scan_forbidden.sh files

      # 🔴 **git grep は追跡ファイルの内容しか見ない。** コミットメッセージは対象外。
      #
      # #188 の漏洩は実際に**コミットメッセージ**で起きた。証拠として貼った実機応答を
      # そのまま本文に入れたもので、ファイル走査では見えない領域だった。
      - name: Scan commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git log --format='%B' "$BASE_SHA"..HEAD | .github/scripts/scan_forbidden.sh text

      # 🔴 **squash merge では PR のタイトルと本文が main のコミットメッセージになる。**
      # このリポジトリは squash merge のみ許可で、title=PR_TITLE / message=PR_BODY 設定。
      #
      # つまり **PR 本文に証拠を貼ると、その文面が main の履歴に入る。**
      # #188 はまさに「証拠として貼った実機応答」が原因だったので、ここを見ないと
      # 同じ経路が開いたままになる。
      #
      # 式は env 経由で渡す (run に直接埋めるとシェルインジェクションになる)。
      - name: Scan PR title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | .github/scripts/scan_forbidden.sh text

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...
