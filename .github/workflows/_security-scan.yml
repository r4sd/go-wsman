name: Security Scan

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # 公開リポジトリなので、実環境のアドレスがコメントや golden file に紛れ込むのを防ぐ。
  # 過去に統合テストの実行例コメント経由で 27 箇所まで蓄積していた。
  # 例示用アドレスは RFC 5737 (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) を使うこと。
  no-private-addresses:
    name: no private addresses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for RFC 1918 addresses
        run: |
          if git grep -nIE '(^|[^0-9.])(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)[0-9]{1,3}\.[0-9]{1,3}' \
               -- . ':(exclude).github/workflows/_security-scan.yml'; then
            echo "::error::プライベート IP アドレスが含まれています。RFC 5737 の例示用アドレスかプレースホルダに置き換えてください。"
            exit 1
          fi
          echo "OK: プライベート IP アドレスなし"

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...
