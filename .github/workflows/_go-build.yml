name: Go Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # ビルドタグ付きのファイルは、タグを指定しない限り**一度もコンパイルされない**。
      # 実装側のシグネチャ変更・定数リネーム・struct のフィールド改名があっても、
      # 統合テストは次に誰かが実機でテストを回すまでエラーに気付かない (#198)。
      #
      # vet はコンパイルして解析するだけで実行しないので、**実機は不要**。
      # go test -tags=integration は実機接続が要るのでここでは使えない。
      - name: Vet (integration tags)
        run: go vet -tags=integration ./...
